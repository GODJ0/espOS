<svg viewBox="0 0 900 740" class="block w-full min-w-[680px]" aria-labelledby="wiring-title wiring-description" xmlns="http://www.w3.org/2000/svg" width="900" height="740"><rect width="900" height="740" fill="#0e1014"></rect><title id="wiring-title">ESP32-S3 DevKitC: подключение ILI9341 и XPT2046</title><desc id="wiring-description">Цветные линии соединяют GPIO с сигналами TFT и тача. SCK, MOSI и MISO общие; точки обозначают соединение. Положение контактов условное, не соответствует порядку на разъёмах.</desc><defs><pattern id="wiring-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e232c" stroke-width="0.5"></path></pattern></defs><rect width="900" height="740" fill="url(#wiring-grid)"></rect><g font-family="JetBrains Mono, monospace" font-size="13" fill="#e7eaef"><text x="30" y="34" fill="#8a93a2">Логическая схема · номера GPIO, не номера контактов разъёма</text><rect x="30" y="85" width="224" height="570" fill="#0e1014" stroke="#475569"></rect><text x="46" y="115" font-size="17">ESP32-S3</text><text x="46" y="137" fill="#8a93a2">DevKitC</text><rect x="636" y="85" width="236" height="340" fill="#0e1014" stroke="#475569"></rect><text x="652" y="115" font-size="17">ILI9341 · TFT</text><text x="652" y="137" fill="#8a93a2">2.8″ / 240 × 320</text><rect x="636" y="446" width="236" height="209" fill="#0e1014" stroke="#475569"></rect><text x="652" y="471" font-size="17">XPT2046 · Touch</text><g><path d="M254 160 H636" stroke="#22d3ee" stroke-width="2" fill="none"></path><text x="238" y="164" text-anchor="end">GPIO 12</text><text x="652" y="164">SCK / SCLK</text><circle cx="254" cy="160" r="3" fill="#22d3ee"></circle><circle cx="636" cy="160" r="3" fill="#22d3ee"></circle><g><path d="M356 160 V560 H636" stroke="#22d3ee" stroke-width="2" fill="none"></path><circle cx="356" cy="160" r="4" fill="#22d3ee"></circle><circle cx="636" cy="560" r="3" fill="#22d3ee"></circle><text x="652" y="564">T_CLK</text></g></g><g><path d="M254 192 H636" stroke="#4ade80" stroke-width="2" fill="none"></path><text x="238" y="196" text-anchor="end">GPIO 11</text><text x="652" y="196">SDI / MOSI</text><circle cx="254" cy="192" r="3" fill="#4ade80"></circle><circle cx="636" cy="192" r="3" fill="#4ade80"></circle><g><path d="M388 192 V592 H636" stroke="#4ade80" stroke-width="2" fill="none"></path><circle cx="388" cy="192" r="4" fill="#4ade80"></circle><circle cx="636" cy="592" r="3" fill="#4ade80"></circle><text x="652" y="596">T_DIN</text></g></g><g><path d="M254 224 H636" stroke="#fbbf24" stroke-width="2" fill="none"></path><text x="238" y="228" text-anchor="end">GPIO 13</text><text x="652" y="228">SDO / MISO</text><circle cx="254" cy="224" r="3" fill="#fbbf24"></circle><circle cx="636" cy="224" r="3" fill="#fbbf24"></circle><g><path d="M420 224 V624 H636" stroke="#fbbf24" stroke-width="2" fill="none"></path><circle cx="420" cy="224" r="4" fill="#fbbf24"></circle><circle cx="636" cy="624" r="3" fill="#fbbf24"></circle><text x="652" y="628">T_DO</text></g></g><g><path d="M254 256 H636" stroke="#a78bfa" stroke-width="2" fill="none"></path><text x="238" y="260" text-anchor="end">GPIO 10</text><text x="652" y="260">CS</text><circle cx="254" cy="256" r="3" fill="#a78bfa"></circle><circle cx="636" cy="256" r="3" fill="#a78bfa"></circle></g><g><path d="M254 288 H636" stroke="#a78bfa" stroke-width="2" fill="none"></path><text x="238" y="292" text-anchor="end">GPIO 9</text><text x="652" y="292">DC / RS</text><circle cx="254" cy="288" r="3" fill="#a78bfa"></circle><circle cx="636" cy="288" r="3" fill="#a78bfa"></circle></g><g><path d="M254 320 H636" stroke="#a78bfa" stroke-width="2" fill="none"></path><text x="238" y="324" text-anchor="end">GPIO 14</text><text x="652" y="324">RESET / RST</text><circle cx="254" cy="320" r="3" fill="#a78bfa"></circle><circle cx="636" cy="320" r="3" fill="#a78bfa"></circle></g><g><path d="M254 352 H636" stroke="#f4646a" stroke-width="2" fill="none" stroke-dasharray="6 4"></path><text x="238" y="356" text-anchor="end">3V3 *</text><text x="652" y="356">VCC *</text><circle cx="254" cy="352" r="3" fill="#f4646a"></circle><circle cx="636" cy="352" r="3" fill="#f4646a"></circle></g><g><path d="M254 384 H636" stroke="#94a3b8" stroke-width="2" fill="none"></path><text x="238" y="388" text-anchor="end">GND</text><text x="652" y="388">GND</text><circle cx="254" cy="384" r="3" fill="#94a3b8"></circle><circle cx="636" cy="384" r="3" fill="#94a3b8"></circle></g><g><text x="238" y="500" text-anchor="end">GPIO 15</text><path d="M254 496 H636" fill="none" stroke="#a78bfa" stroke-width="2"></path><circle cx="254" cy="496" r="3" fill="#a78bfa"></circle><circle cx="636" cy="496" r="3" fill="#a78bfa"></circle><text x="652" y="500">T_CS</text></g><g><text x="238" y="532" text-anchor="end">GPIO 16</text><path d="M254 528 H636" fill="none" stroke="#a78bfa" stroke-width="2"></path><circle cx="254" cy="528" r="3" fill="#a78bfa"></circle><circle cx="636" cy="528" r="3" fill="#a78bfa"></circle><text x="652" y="532">T_IRQ</text></g><text x="46" y="596" fill="#8a93a2">USB: GPIO 19 / 20</text><text x="46" y="619" fill="#8a93a2">не подключать к TFT</text><text x="30" y="687" fill="#f4646a">* VCC: проверить паспорт модуля; сигнальные уровни только 3.3 V.</text><text x="30" y="712" fill="#8a93a2">LED / BL показан отдельно в примечаниях. SD-карта не подключена.</text></g></svg>